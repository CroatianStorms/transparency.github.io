<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Transparency — Minimal dark homepage" />
    <title>Transparency</title>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #121a24;
        --panel-strong: #182431;
        --text: #e6edf3;
        --muted: #9aa7b2;
        --line: rgba(255,255,255,0.08);
        --accent: #7dd3fc;
        --accent-strong: #38bdf8;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, rgba(56, 189, 248, 0.12), transparent 45%), var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 32px 20px;
      }

      .card {
        width: min(760px, 100%);
        background: rgba(18, 26, 36, 0.88);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .header {
        padding: 26px 28px 18px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .brand-mark {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        box-shadow: 0 0 12px rgba(125, 211, 252, 0.9);
      }

      .content {
        padding: 34px 28px 28px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2.3rem, 5vw, 4rem);
        line-height: 1.02;
        letter-spacing: -0.06em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.06rem;
        line-height: 1.7;
        max-width: 52ch;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 999px;
        border: 1px solid var(--line);
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #041018;
        border-color: transparent;
      }

      .button.secondary {
        background: transparent;
        color: var(--text);
      }

      @media (max-width: 560px) {
        .header, .content {
          padding-left: 20px;
          padding-right: 20px;
        }

        .actions {
          flex-direction: column;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          Transparency
        </div>
      </div>

      <div class="content">
        <h1>Clearer systems.<br />Better trust.</h1>
        <p>
          Transparency is a minimal digital presence focused on open information, thoughtful design,
          and public accountability.
        </p>

        <div class="actions">
          <a class="button primary" href="mailto:hello@transparency.example">Contact</a>
          <a class="button secondary" href="#about">Learn more</a>
        </div>
      </div>
    </main>
  </body>
</html>
